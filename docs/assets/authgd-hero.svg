<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">authGD identity and access flow</title>
  <desc id="desc">EVE SSO identity and linked characters flow through authGD, which reconciles Discord roles, Wanderer ACL membership, and in-game personal standings. Postgres, a background worker, audit history, and payout operations support the system.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d9b85f"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27334e" stroke-width="1" opacity="0.36"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#10182b"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- registration marks -->
  <path d="M32 64 V32 H64 M1216 32 H1248 V64 M32 576 V608 H64 M1216 608 H1248 V576" fill="none" stroke="#6e7890" stroke-width="2" opacity="0.72"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2.5" fill="#a6afc1">
    <text x="72" y="58">AUTHGD / SYSTEM OVERVIEW</text>
    <text x="1208" y="58" text-anchor="end">ONE DEPLOYMENT · ONE CORP OR ALLIANCE</text>
  </g>

  <text x="72" y="142" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="750" letter-spacing="-3" fill="#f0d06f">authGD</text>
  <text x="73" y="181" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f2eee2">focused identity and access for EVE corporations</text>
  <text x="74" y="213" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.2" fill="#aeb7ca">SSO IN · MEMBERSHIP DECIDED · ACCESS RECONCILED</text>

  <!-- Input node -->
  <g>
    <rect x="72" y="284" width="270" height="184" fill="#17223b" stroke="#66728b" stroke-width="1.5"/>
    <line x1="72" y1="325" x2="342" y2="325" stroke="#66728b" stroke-width="1"/>
    <text x="92" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#aeb7ca">01 / IDENTITY SOURCE</text>
    <text x="92" y="365" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#f2eee2">EVE SSO</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#c6ccda">
      <text x="92" y="401">main character</text>
      <text x="92" y="428">linked alts</text>
      <text x="92" y="455">alliance membership</text>
    </g>
    <g fill="#f0d06f">
      <circle cx="312" cy="397" r="4"/>
      <circle cx="312" cy="424" r="4"/>
      <circle cx="312" cy="451" r="4"/>
    </g>
  </g>

  <!-- Control plane -->
  <g>
    <rect x="448" y="252" width="354" height="248" fill="#192641" stroke="#d9b85f" stroke-width="2"/>
    <line x1="448" y1="296" x2="802" y2="296" stroke="#826f43" stroke-width="1"/>
    <text x="470" y="279" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#c9b77e">02 / CONTROL PLANE</text>
    <text x="470" y="350" font-family="Arial, Helvetica, sans-serif" font-size="47" font-weight="750" letter-spacing="-1.5" fill="#f0d06f">authGD</text>
    <text x="470" y="381" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#f2eee2">membership rules · audit history · payouts</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.2">
      <rect x="470" y="414" width="88" height="35" fill="#10182b" stroke="#66728b"/>
      <text x="514" y="437" text-anchor="middle" fill="#c6ccda">WEB + API</text>
      <rect x="568" y="414" width="105" height="35" fill="#10182b" stroke="#66728b"/>
      <text x="620.5" y="437" text-anchor="middle" fill="#c6ccda">POSTGRES 16</text>
      <rect x="683" y="414" width="97" height="35" fill="#10182b" stroke="#66728b"/>
      <text x="731.5" y="437" text-anchor="middle" fill="#c6ccda">PG-BOSS</text>
    </g>
    <text x="470" y="478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.5" fill="#9ea8bc">IDEMPOTENT DIFF + APPLY · DRY-RUN OR LIVE</text>
  </g>

  <!-- Output nodes -->
  <g>
    <rect x="934" y="239" width="274" height="76" fill="#17223b" stroke="#66728b" stroke-width="1.5"/>
    <text x="954" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#aeb7ca">03A / DISCORD</text>
    <text x="954" y="295" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#f2eee2">exact tier role</text>

    <rect x="934" y="337" width="274" height="76" fill="#17223b" stroke="#66728b" stroke-width="1.5"/>
    <text x="954" y="364" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#aeb7ca">03B / WANDERER</text>
    <text x="954" y="393" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#f2eee2">ACL membership</text>

    <rect x="934" y="435" width="274" height="76" fill="#17223b" stroke="#66728b" stroke-width="1.5"/>
    <text x="954" y="462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.8" fill="#aeb7ca">03C / EVE CONTACTS</text>
    <text x="954" y="491" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#f2eee2">personal standings</text>
  </g>

  <!-- Connectors -->
  <path d="M342 376 H420 Q434 376 448 376" fill="none" stroke="#d9b85f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="395" cy="376" r="5" fill="#10182b" stroke="#d9b85f" stroke-width="2"/>

  <path d="M802 376 H868 V277 H924" fill="none" stroke="#d9b85f" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M868 376 H924" fill="none" stroke="#d9b85f" stroke-width="2.2" marker-end="url(#arrow)"/>
  <path d="M868 376 V473 H924" fill="none" stroke="#d9b85f" stroke-width="2.2" marker-end="url(#arrow)"/>
  <circle cx="868" cy="376" r="6" fill="#10182b" stroke="#d9b85f" stroke-width="2"/>

  <!-- Footer -->
  <line x1="72" y1="558" x2="1208" y2="558" stroke="#66728b" stroke-width="1"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.7" fill="#aeb7ca">
    <text x="72" y="591">ALT LINKING · TIER STATE · TOKEN HEALTH · AUDIT LOG · PAYOUT OPERATIONS</text>
    <text x="1208" y="591" text-anchor="end" fill="#f0d06f">DEROLE, DON'T BOOT</text>
  </g>
</svg>
