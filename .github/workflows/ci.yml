name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run in flight for the same ref. main is excluded so
# every commit that lands keeps a complete, attributable run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  static:
    name: Typecheck, lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Runs before the linters: if the Node pin has drifted, everything below
      # ran on the wrong runtime and the results are not worth reading.
      - name: Check Node version pins agree
        run: bash scripts/check-node-version.sh
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Recruitment review tooling tests
        run: npm run test:recruitment-review

  build:
    name: Next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No env block on purpose: getConfig() validates lazily per request and
      # every route is dynamic, so nothing calls it at build time. Verified by
      # building with DATABASE_URL and TOKEN_ENCRYPTION_KEY unset.
      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The `Next build` job above builds the full checkout; this one builds
      # what Fly actually ships, where .dockerignore has pruned the context.
      # Without this gate, a file that reaches into an ignored directory type
      # checks clean on every PR and only fails at `flyctl deploy`. No Node
      # setup or npm ci: the Dockerfile installs its own dependencies.
      - name: Build image
        run: docker build .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://authgd:authgd@127.0.0.1:5433/authgd_test_unit
      FLEET_LEGACY_TEST_DATABASE_URL: postgres://authgd:authgd@127.0.0.1:5433/authgd_test_unit_legacy_migration

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: authgd
          POSTGRES_PASSWORD: authgd
          # This job owns a fresh service. Only the current-schema DB is made
          # by postgres init; the isolated pre-combat sibling is created below.
          POSTGRES_DB: authgd_test_unit
        # The e2e job has its own service container on the same isolated port.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U authgd -d authgd_test_unit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Provision isolated legacy fixture database
        run: |
          node --import tsx -e '
            const { Client } = require("pg");
            const { legacyFixtureProvisionPlan } = require("./tests/helpers/fleet-legacy-db.ts");
            async function provision() {
              const plan = legacyFixtureProvisionPlan(process.env);
              const client = new Client({ connectionString: plan.connectionString, connectionTimeoutMillis: 3000 });
              try {
                await client.connect();
                await client.query(plan.sql);
              } finally {
                await client.end();
              }
            }
            provision().catch((error) => { console.error(error); process.exitCode = 1; });
          '

      - uses: ./.github/actions/fleet-proof-prerequisites
      - name: Fetch pinned pre-feature reader for the mixed-version rehearsal
        run: git fetch --no-tags origin 62b2c6cd8d5ad7cc346ad4f96205e96e19f3e07d
      - name: Fetch published pre-combat backend for the historical fixture
        run: git fetch --no-tags origin 123a4d2547e2a93fefd1044645fedff1ad581b8b

      # Runner lifecycle tests launch real Chromium and `next start` under CI.
      # This job has neither the e2e job's browsers nor the build job's .next.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build

      # Each helper migrates its own DB: current schema in setupTestDb(),
      # pinned pre-0025 schema only in the isolated historical fixture.
      - name: Unit tests
        run: npm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: authgd
          POSTGRES_PASSWORD: authgd
          POSTGRES_DB: authgd_test
        # See the `unit` job: same port, separate container. e2e/env.ts keeps
        # this default specifically for CI; locally it derives a per-worktree
        # database instead.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U authgd -d authgd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Keyed on the resolved @playwright/test version: the browser build is
      # tied to the package version, not to the whole lockfile.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      # playwright.config.ts declares no `projects`, so only chromium is used.
      # On a cache hit the browser is present but its apt dependencies are not,
      # since those live outside the cached directory.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts serves this build with `next start` under CI
      # instead of `next dev`, so route compilation is paid once here rather
      # than lazily on the first request to each route — which, under
      # `workers: 1`, meant paying it serially in front of the tests.
      #
      # Built here rather than pulled from the `Next build` job: `needs:` would
      # serialize this job behind that one, and `output: "standalone"` makes
      # .next an artifact that embeds a traced node_modules. Both cost more
      # than the build itself.
      #
      # No env block, for the same reason that job has none: getConfig()
      # validates lazily per request and every route is dynamic.
      - name: Build
        run: npm run build

      # e2e/helpers.ts only TRUNCATEs and assumes the schema exists. Locally
      # e2e/provision.ts migrates as part of standing up the per-worktree
      # container, but that is gated on `!IS_CI` — so under CI this step is the
      # only thing that creates the schema.
      - name: Apply migrations to test database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://authgd:authgd@localhost:5433/authgd_test

      - name: E2E tests
        run: npm run test:e2e

      - uses: ./.github/actions/fleet-proof-prerequisites
      # Shares this job's build/database; never run alongside the dry-run suite.
      - name: Fleet integration E2E tests
        run: npm run test:e2e:fleet

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
