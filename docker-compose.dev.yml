services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: authgd
      POSTGRES_PASSWORD: authgd
      POSTGRES_DB: authgd
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
volumes:
  pgdata:
